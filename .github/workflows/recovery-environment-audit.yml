name: Recovery environment audit
on:
  push:
    branches: [release/2.1.0-qualification-recovery]
    paths:
      - .github/workflows/recovery-environment-audit.yml
      - native/tests/prepare-ci-renderer.sh
      - native/tests/standalone-wayland.sh
      - native/tests/private_compositor.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    name: Inspect ${{ matrix.distro }} repository and compositors
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Manjaro
            image: manjarolinux/base:latest
            snapshot: ''
          - distro: Arch-pinned-X11
            image: archlinux:base-20260927.0.600689@sha256:b21322c663be387c0ed9cbc7bbbfe18e41633ad4e7b7c77cfad45f128be20040
            snapshot: '2026/09/27'
    steps:
      - uses: actions/checkout@v4
      - name: Provide a software buffer device on this disposable runner
        if: matrix.distro == 'Manjaro'
        run: bash native/tests/prepare-ci-renderer.sh
      - name: Inspect actual repositories without mixing distribution packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          docker pull '${{ matrix.image }}'
          docker image inspect '${{ matrix.image }}' --format '{{json .RepoDigests}}' > work/image-digest.txt
          render_args=()
          if [ '${{ matrix.distro }}' = Manjaro ]; then
            render_args=(--device /dev/udmabuf --env OPM_TEST_KWIN_COMPOSE=O2 --env KWIN_RENDER_NODES= --env KWIN_DISABLE_VULKAN=1 --env LIBGL_ALWAYS_SOFTWARE=1)
          fi
          set +e
          docker run --rm "${render_args[@]}" --mount type=bind,src="$GITHUB_WORKSPACE/native/tests",dst=/opm-tests,readonly -e OPM_ARCH_SNAPSHOT='${{ matrix.snapshot }}' '${{ matrix.image }}' bash -c '
            set -euo pipefail
            if [ -n "$OPM_ARCH_SNAPSHOT" ]; then
              printf "Server = https://archive.archlinux.org/repos/%s/\$repo/os/\$arch\n" "$OPM_ARCH_SNAPSHOT" > /etc/pacman.d/mirrorlist
            fi
            date -u
            cat /etc/os-release
            pacman --disable-download-timeout -Syu --noconfirm --needed plasma-workspace kwin qt6-base kcoreaddons kconfig kservice libplasma
            pacman -Q
            printf "OPM_RUNTIME_VERSION "
            pacman -Q plasma-workspace kwin qt6-base kcoreaddons kconfig kservice libplasma | tr "\n" ";"
            printf "\n"
            if pacman --disable-download-timeout -Si kwin-x11; then
              pacman --disable-download-timeout -S --noconfirm --needed kwin-x11
              printf "OPM_X11_PACKAGE "
              pacman -Q kwin-x11
            else
              printf "OPM_X11_PACKAGE absent from current repositories\n"
            fi
            for binary in kwin_x11 kwin_wayland startplasma-x11 startplasma-wayland; do
              printf "OPM_COMPOSITOR %s " "$binary"
              command -v "$binary" || true
            done
            if [ -c /dev/udmabuf ]; then
              (getent passwd 1000 >/dev/null || useradd --uid 1000 --create-home builder)
              runuser -u "$(id -nu 1000)" -- dbus-run-session -- env OPM_WAYLAND_COMPOSITOR=kwin sh /opm-tests/standalone-wayland.sh /bin/true
              printf "OPM_RENDERER software OpenGL via udmabuf; active compositor verified\n"
            fi
            date -u
          ' 2>&1 | tee work/environment.log
          result=${PIPESTATUS[0]}
          python3 - <<'PY'
          from pathlib import Path
          for line in Path('work/environment.log').read_text().splitlines():
              if line.startswith('OPM_'):
                  print('::notice title=Runtime audit::'+line.replace('%','%25'))
          PY
          test "$result" -eq 0
      - name: Expose package failures
        if: failure()
        run: python3 scripts/report-ci-failure.py work/environment.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-environment-${{ matrix.distro }}-${{ github.sha }}
          path: work/
          retention-days: 90
